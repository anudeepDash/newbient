<!doctype html>
<html lang="en">
<head>
  <!--
    Template for the landing site (newbi.live: /, /creator, /contact, /terms, /privacy).
    scripts/prerender.mjs fills in the page head and HTML at build time; the app
    (everything else) uses index.html.
  -->
  <script>
    (function () {
      try {
        var saved = null;
        try { saved = localStorage.getItem('nb_theme'); } catch (e) {}
        var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', !!dark);
        window.__nbFirstChrome = dark ? '#050505' : '#F4F2EC';
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F2EC" />
  <script>try { document.querySelector('meta[name="theme-color"]').setAttribute('content', window.__nbFirstChrome || '#F4F2EC'); } catch (e) {}</script>
  <meta name="color-scheme" content="light dark" />
  <!--landing-head-->
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/brand/newbi-icon-app-180.png" />
  <link rel="preload" href="/api/forms?type=public-feed" as="fetch" crossorigin="anonymous" />
  <!-- Themed logo (src/components/brand/NewbiLogo.jsx): black in light mode, outlined in dark.
       Kept here, not in a generated stylesheet, so it can never go missing. -->
  <style>.nb-logo-on-light{display:inline-block}.nb-logo-on-dark{display:none}.dark .nb-logo-on-light{display:none}.dark .nb-logo-on-dark{display:inline-block}</style>
</head>
<body>
  <div id="landing-root"><!--landing-html--></div>
  <script type="module" src="/src/landing/main.jsx"></script>
</body>
</html>
